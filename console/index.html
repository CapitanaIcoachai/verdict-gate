<style>

  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101615; --panel:#192120; --fg:#e9edeb; --muted:#9fa9a6; --line:#2d3936; --line-soft:#222c2a;
  --accent:#5fb6d1; --accent-2:#0f6e8c; --accent-soft:#17303a; --accent-ink:#ffffff;
  --ok:#6cc98a; --ok-soft:#163023; --bad:#f08a82; --bad-soft:#3a1d1a; --warn:#e8b55a; --warn-soft:#352a12; --grey:#9aa39f; --grey-soft:#252e2c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101615; --panel:#192120; --fg:#e9edeb; --muted:#9fa9a6; --line:#2d3936; --line-soft:#222c2a;
  --accent:#5fb6d1; --accent-2:#0f6e8c; --accent-soft:#17303a; --accent-ink:#ffffff;
  --ok:#6cc98a; --ok-soft:#163023; --bad:#f08a82; --bad-soft:#3a1d1a; --warn:#e8b55a; --warn-soft:#352a12; --grey:#9aa39f; --grey-soft:#252e2c;

<script>
// Verdict Gate core: deterministic verifiers. No dependencies.
var VG = (function(){
  // ---------- statistics (flaky verifier) ----------
  function lnGamma(z){ // Lanczos
    var g=7, c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
    if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-lnGamma(1-z);
    z-=1; var x=c[0]; for(var i=1;i<g+2;i++) x+=c[i]/(z+i);
    var t=z+g+0.5; return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);
  }
  function lnChoose(n,k){ return lnGamma(n+1)-lnGamma(k+1)-lnGamma(n-k+1); }
  // one-sided Fisher exact: P(head failures <= observed | margins), i.e. evidence that head fails less than base
  function fisherOneSided(baseFail, baseRuns, headFail, headRuns){
    var K=baseFail+headFail, N=baseRuns+headRuns, n=headRuns;
    var lo=Math.max(0,K-(N-n)), hi=Math.min(K,n), p=0;
    for(var x=lo;x<=headFail;x++){ p+=Math.exp(lnChoose(K,x)+lnChoose(N-K,n-x)-lnChoose(N,n)); }
    return Math.min(1,p);
  }
  function binomCdf(k,n,p){ var s=0; for(var i=0;i<=k;i++) s+=Math.exp(lnChoose(n,i)+i*Math.log(p)+(n-i)*Math.log(1-p)); return s; }
  // Clopper-Pearson upper bound (one-sided, conf)
  function upperBound(fail,n,conf){
    if(fail>=n) return 1;
    var a=1-conf, lo=fail/n, hi=1, mid;
    for(var i=0;i<60;i++){ mid=(lo+hi)/2; if(binomCdf(fail,n,mid)>a) lo=mid; else hi=mid; }
    return hi;
  }
  function runsNeeded(target,conf){ return Math.ceil(Math.log(1-conf)/Math.log(1-target)); }

  function flakyVerdict(o){
    // o: baseRuns, baseFail, headRuns, headFail, alpha, target, looks, lookIndex, conf, brokenBase, brokenHead, guards[]
    var alpha=(o.alpha||0.05)/(o.looks||1), conf=o.conf||0.95, target=o.target||0.05;
    var res={verifier:"flaky", alphaUsed:alpha};
    if(o.brokenBase||o.brokenHead){ res.outcome="BROKEN"; res.detail="BROKEN: "+(o.brokenBase?"base":"head")+" fails every early run with the same error"; return fin(res,o); }
    if(o.baseFail===0){ res.outcome="UNSURE"; res.detail="NOT REPRODUCED: 0 failures on base out of "+o.baseRuns; return fin(res,o); }
    var p=fisherOneSided(o.baseFail,o.baseRuns,o.headFail,o.headRuns); res.p=p;
    if(o.headFail>0){
      res.outcome="FAIL";
      res.detail= p<alpha ? "NOT FIXED, better but still flaky" : "NOT FIXED, no measurable effect";
      return fin(res,o);
    }
    var ub=upperBound(0,o.headRuns,conf); res.upperBound=ub;
    if(p<alpha && ub<=target){ res.outcome="PASS"; res.detail="FIXED: residual failure rate below "+(target*100).toFixed(0)+"% at "+(conf*100).toFixed(0)+"% confidence"; }
    else { res.outcome="UNSURE"; res.detail="NEED MORE RUNS: "+runsNeeded(target,conf)+" clean head runs needed for "+(target*100).toFixed(0)+"%"; res.runsNeeded=runsNeeded(target,conf); }
    return fin(res,o);
  }
  function fin(res,o){
    res.evidence=[{where:"base",runs:o.baseRuns,failures:o.baseFail},{where:"head",runs:o.headRuns,failures:o.headFail}];
    if(res.p!==undefined) res.evidence.push({p:+res.p.toPrecision(3)});
    if(res.upperBound!==undefined) res.evidence.push({upper_bound_95:+(res.upperBound).toPrecision(3)});
    res.guards=o.guards||[];
    if(res.outcome==="PASS" && res.guards.length){ res.detail="FIXED, BUT TEST WEAKENED ("+res.guards.join("; ")+")"; res.needs_human=true; }
    else res.needs_human = res.outcome!=="PASS";
    return res;
  }

function setLast(v){ lastVerdict=v; var line=VG.verdictLine(v); var pre=document.getElementById('g-verdict'); pre.textContent=line; pre.classList.remove('empty'); pre.dataset.filled='1'; var md=document.getElementById('g-md'); md.textContent=mrComment(v); md.classList.remove('empty'); md.dataset.filled='1'; }
function mrComment(v){
  var rows=(v.evidence||[]).map(function(e){ return '| '+Object.keys(e).map(function(k){return k+': '+esc0(e[k]);}).join(' · ')+' |'; }).join('\n');
  return '### Verdict Gate · '+v.verifier+(v.target?' · `'+v.target+'`':'')+'\n\n'+
    '**'+t('md_outcome')+':** '+v.outcome+'  \n**'+t('md_detail')+':** '+v.detail+'\n\n'+
    '**'+t('md_evidence')+'**\n\n| |\n|---|\n'+(rows||'| - |')+'\n\n'+
    '**'+t('md_guards')+':** '+((v.guards&&v.guards.length)?v.guards.join('; '):'-')+'  \n**'+t('md_human')+':** '+(v.needs_human?t('yes'):t('no'))+
    (v.limits?'\n\n_'+v.limits+'_':'')+'\n\n<!-- verdict-gate/1 -->';
}
function esc0(x){ return typeof x==='object'?JSON.stringify(x):String(x); }
var OUT_ICON={PASS:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7 12l3 3 7-7"/></svg>',FAIL:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 8l8 8M16 8l-8 8"/></svg>',UNSURE:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.7M12 17h.01"/></svg>',BROKEN:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M7 12h10"/></svg>'};
function outHead(v){ return '<div class="out '+v.outcome+'">'+OUT_ICON[v.outcome]+'<span class="big">'+esc(v.outcome)+'</span></div><div class="detail">'+esc(v.detail)+'</div>'; }
function verdictFooter(v){ return '<h3>VERDICT</h3><pre>'+esc(VG.verdictLine(v))+'</pre><div class="btns"><button class="btn sec" onclick="copyText(VG.verdictLine(lastVerdict))">'+esc(t('btn_copy'))+'</button><button class="btn ghost" onclick="copyText(mrComment(lastVerdict))">'+esc(t('g_copy_md'))+'</button></div>'; }

// ---------- flaky ----------
function num(id){ return Math.max(0,parseInt(document.getElementById(id).value,10)||0); }
function runFlaky(){
  var o={baseRuns:num('f-br'),baseFail:num('f-bf'),headRuns:num('f-hr'),headFail:num('f-hf'),alpha:parseFloat(document.getElementById('f-alpha').value)||0.05,looks:num('f-looks')||1,target:parseFloat(document.getElementById('f-target').value)||0.05,conf:0.95};
  var log=document.getElementById('f-log').value.trim();
  if(log){ var r=VG.parseRunLog(log); if(r.baseRuns||r.headRuns){ o.baseRuns=r.baseRuns;o.baseFail=r.baseFail;o.headRuns=r.headRuns;o.headFail=r.headFail; ['f-br','f-bf','f-hr','f-hf'].forEach(function(id,i){document.getElementById(id).value=[r.baseRuns,r.baseFail,r.headRuns,r.headFail][i];}); } }
  o.brokenBase=document.getElementById('f-broken').checked;
  o.guards=VG.diffGuard(document.getElementById('f-diff').value);
  if(o.baseFail>o.baseRuns) o.baseFail=o.baseRuns; if(o.headFail>o.headRuns) o.headFail=o.headRuns;
  var v=VG.flakyVerdict(o); v.target=document.getElementById('f-log').value.match(/::\S+|test_\w+/)?RegExp.lastMatch:'flaky test';
  var h=outHead(v);
  h+='<div class="tbl"><table><tr><th></th><th class="num">'+t('f_base_runs')+'</th><th class="num">'+t('f_base_fail')+'</th><th class="num">'+t('f_head_runs')+'</th><th class="num">'+t('f_head_fail')+'</th></tr><tr><td>runs</td><td class="num">'+o.baseRuns+'</td><td class="num">'+o.baseFail+'</td><td class="num">'+o.headRuns+'</td><td class="num">'+o.headFail+'</td></tr></table></div>';
  h+='<div class="tbl"><table>';
  if(v.p!==undefined) h+='<tr><td>'+t('f_p')+'</td><td class="num">'+v.p.toPrecision(3)+'</td></tr>';
  h+='<tr><td>'+t('f_alpha_used')+'</td><td class="num">'+v.alphaUsed.toPrecision(3)+'</td></tr>';
  if(v.upperBound!==undefined) h+='<tr><td>'+t('f_ub')+'</td><td class="num">'+(v.upperBound*100).toFixed(2)+'%</td></tr>';
  if(v.runsNeeded) h+='<tr><td>'+t('f_runs')+'</td><td class="num">'+v.runsNeeded+'</td></tr>';
  h+='</table></div>';
  if(v.guards.length) h+='<ul class="guards">'+v.guards.map(function(g){return '<li>'+esc(g)+'</li>';}).join('')+'</ul>';
  setLast(v); h+=verdictFooter(v);
  document.getElementById('f-out').innerHTML=h;
}
document.getElementById('f-run').onclick=runFlaky;
document.getElementById('f-sim').onclick=function(){ var r=VG.simulate(0.14,0.14,100,Date.now()%100000); document.getElementById('f-log').value=''; document.getElementById('f-br').value=r.baseRuns; document.getElementById('f-bf').value=r.baseFail; document.getElementById('f-hr').value=r.headRuns; document.getElementById('f-hf').value=r.headFail; runFlaky(); };
function fEx(b,bf,h,hf,diff){ document.getElementById('f-log').value=''; document.getElementById('f-broken').checked=false; document.getElementById('f-br').value=b; document.getElementById('f-bf').value=bf; document.getElementById('f-hr').value=h; document.getElementById('f-hf').value=hf; document.getElementById('f-diff').value=diff||''; runFlaky(); }
document.getElementById('f-ex1').onclick=function(){ fEx(60,8,60,6,'--- a/src/checkout.py\n+++ b/src/checkout.py\n+    time.sleep(0.01)'); };
document.getElementById('f-ex2').onclick=function(){ fEx(60,11,60,0,'--- a/src/checkout.py\n+++ b/src/checkout.py\n-    best = sorted(set(codes))[-1]\n+    best = max(set(codes), key=COUPONS.get)'); };
document.getElementById('f-ex3').onclick=function(){ fEx(60,15,60,0,'--- a/tests/test_checkout.py\n+++ b/tests/test_checkout.py\n-    assert total == 42\n+    assert total >= 30'); };

// ---------- upgrade ----------
var CHALK_OLD={name:"chalk",version:"4.1.2",main:"source",engines:{node:">=10"}};
var CHALK_NEW={name:"chalk",version:"6.0.1",type:"module",exports:"./source/index.js",engines:{node:">=20"}};
function renderUpgrade(v){
  var h=outHead(v);
  h+='<div class="tbl"><table><tr><th>'+t('u_fact')+'</th><th>'+t('u_oldc')+'</th><th>'+t('u_newc')+'</th><th>'+t('u_where')+'</th><th>'+t('u_breaks')+'</th></tr>';
  if(!v.evidence.length) h+='<tr><td colspan="5" class="empty">-</td></tr>';
  v.evidence.forEach(function(f){ h+='<tr><td>'+esc(f.fact)+'</td><td><code>'+esc(f.old)+'</code></td><td><code>'+esc(f.neu)+'</code></td><td>'+esc(f.where)+'</td><td>'+(f.breaks?'<span class="pill bad">BREAKS</span>':'<span class="pill warn">REVIEW</span>')+'</td></tr>'; });
  h+='</table></div>';
  var u=v.usage; h+='<p class="note">'+t('u_usage')+': '+t('u_cjs')+' '+u.cjs+' · '+t('u_esm')+' '+u.esm+' · '+t('u_deep')+' '+(Object.keys(u.deep).join(', ')||'-')+'</p>';
  h+='<div class="limits">'+esc(t('u_limits'))+'</div>';
  setLast(v); h+=verdictFooter(v);
  document.getElementById('u-out').innerHTML=h;
}
document.getElementById('u-ex').onclick=function(){ document.getElementById('u-name').value='chalk'; document.getElementById('u-old').value='4.1.2'; document.getElementById('u-new').value='6.0.1'; document.getElementById('u-oldpkg').value=JSON.stringify(CHALK_OLD,null,2); document.getElementById('u-newpkg').value=JSON.stringify(CHALK_NEW,null,2); document.getElementById('u-manual-box').hidden=false; runUpgradeManual(); };
document.getElementById('u-manual').onclick=function(){ var b=document.getElementById('u-manual-box'); b.hidden=!b.hidden; };
function runUpgradeManual(){ var o,n; try{ o=JSON.parse(document.getElementById('u-oldpkg').value); n=JSON.parse(document.getElementById('u-newpkg').value); }catch(e){ toast(t('json_err')+e.message); return; } renderUpgrade(VG.upgradeVerdict(document.getElementById('u-name').value.trim(),o,n,document.getElementById('u-code').value)); }
document.getElementById('u-run').onclick=runUpgradeManual;
document.getElementById('u-fetch').onclick=function(){
  var name=document.getElementById('u-name').value.trim(), oldV=document.getElementById('u-old').value.trim().replace(/^[\^~]/,''), newV=document.getElementById('u-new').value.trim();
  var btn=this; btn.disabled=true;
  fetch('https://registry.npmjs.org/'+encodeURIComponent(name).replace('%40','@'),{headers:{'Accept':'application/json'}}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(doc){
    var versions=doc.versions||{}; if(!newV) newV=(doc['dist-tags']||{}).latest;
    var o=versions[oldV], n=versions[newV];
    if(!o) throw new Error(t('ver_missing')+oldV); if(!n) throw new Error(t('ver_missing')+newV);
    document.getElementById('u-new').value=newV;
    document.getElementById('u-oldpkg').value=JSON.stringify(pick(o),null,2); document.getElementById('u-newpkg').value=JSON.stringify(pick(n),null,2);
    renderUpgrade(VG.upgradeVerdict(name,o,n,document.getElementById('u-code').value));
  }).catch(function(e){ toast(t('fetch_err')+e.message); document.getElementById('u-manual-box').hidden=false; }).then(function(){ btn.disabled=false; });
};
function pick(p){ var o={}; ['name','version','type','main','module','exports','bin','engines','peerDependencies','deprecated'].forEach(function(k){ if(p[k]!==undefined) o[k]=p[k]; }); return o; }

// ---------- i18n ----------
var I18N_EX={src:document.getElementById('i-src').value,tgt:document.getElementById('i-tgt').value};
function runI18n(){
  var s,g; try{ s=JSON.parse(document.getElementById('i-src').value); g=JSON.parse(document.getElementById('i-tgt').value); }catch(e){ toast(t('json_err')+e.message); return; }
  var gl=document.getElementById('i-gloss').value.split(',').map(function(x){return x.trim();}).filter(Boolean);
  var v=VG.i18nVerdict(s,g,{maxRatio:parseFloat(document.getElementById('i-ratio').value)||1.6,glossary:gl}); v.target=Object.keys(s).length+' keys';
  var h=outHead(v);
  h+='<div class="tbl"><table><tr><th>'+t('i_key')+'</th><th>'+t('i_type')+'</th><th>'+t('i_srcc')+'</th><th>'+t('i_tgtc')+'</th></tr>';
  if(!v.evidence.length) h+='<tr><td colspan="4" class="empty">-</td></tr>';
  v.evidence.forEach(function(d){ h+='<tr><td><code>'+esc(d.key)+'</code></td><td><span class="pill '+(d.type==='length'?'warn':'bad')+'">'+esc(t('i_t_'+d.type))+(d.limit?' &gt; '+d.limit:'')+'</span></td><td>'+esc(d.src)+'</td><td>'+esc(d.tgt)+'</td></tr>'; });
  h+='</table></div>';
  if(v.extraKeys.length) h+='<p class="note">'+t('i_extra')+' '+v.extraKeys.map(function(k){return '<code>'+esc(k)+'</code>';}).join(', ')+'</p>';
  var vv={verifier:v.verifier,target:v.target,outcome:v.outcome,detail:v.detail,evidence:v.evidence.map(function(d){return {key:d.key,type:d.type};}),guards:[],needs_human:v.needs_human};
  setLast(vv); h+=verdictFooter(vv);
  document.getElementById('i-out').innerHTML=h;
}
document.getElementById('i-run').onclick=runI18n;
document.getElementById('i-ex').onclick=function(){ document.getElementById('i-src').value=I18N_EX.src; document.getElementById('i-tgt').value=I18N_EX.tgt; runI18n(); };

// ---------- gitlab files ----------
var FILES={
verify:function(){return [
'# templates/verify.yml  (CI/CD component: include it in .gitlab-ci.yml)',
'spec:',
'  inputs:',
'    stage: { default: test }',
'    runs:  { default: "100" }',
'---',
'verdict-gate:verify:',
'  stage: $[[ inputs.stage ]]',
'  image: python:3.12          # full image, git included; node installed below for the upgrade verifier',
'  variables: { GIT_DEPTH: "0", VG_RUNS: $[[ inputs.runs ]] }',
'  rules:',
'    - if: \'$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(upgrade|flaky-fix|i18n)/\'',
'  before_script:',
'    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"',
'    - apt-get update -qq && apt-get install -y -qq nodejs npm > /dev/null',
'  script:',
'    - |',
'      case "$CI_MERGE_REQUEST_LABELS" in',
'        *upgrade*)   node verifiers/upgrade/bin/upgrade-radar.mjs mr --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --json verdict.json ;;',
'        *flaky-fix*) python3 verifiers/flaky/fixorfluke.pyz ci-verify --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --runs "$VG_RUNS" --json verdict.json ;;',
'        *i18n*)      python3 verifiers/i18n/i18n_gate.py --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --json verdict.json ;;',
'      esac',
'    - python3 schema/check.py verdict.json          # conformance to verdict-v1.json, exits 1 if invalid',
'    - echo "VERDICT $(cat verdict.json | tr -d \'\\n\')"  # the single line the Duo flow reads',
'    - python3 schema/exit.py verdict.json           # PASS 0 · FAIL 2 · UNSURE 3 · BROKEN 5',
'  artifacts:',
'    when: always',
'    paths: [verdict.json, report.html, report.md]',
'    expose_as: "Verdict Gate report"',
'  allow_failure:',
'    exit_codes: [3]                                  # UNSURE warns, does not block'].join('\n');},
monitor:function(){return [
'# templates/monitor.yml  (scheduled pipeline, every Monday: re-measures on the main branch)',
'verdict-gate:monitor:',
'  stage: test',
'  image: python:3.12',
'  rules:',
'    - if: \'$CI_PIPELINE_SOURCE == "schedule"\'',
'  script:',
'    - python3 verifiers/flaky/fixorfluke.pyz monitor --quarantine flaky-quarantine.toml --json monitor-flaky.json',
'    - node verifiers/upgrade/bin/upgrade-radar.mjs scan . --json monitor-upgrade.json',
'    - echo "VERDICT $(python3 schema/merge.py monitor-flaky.json monitor-upgrade.json | tr -d \'\\n\')"',
'  artifacts: { paths: [monitor-flaky.json, monitor-upgrade.json], when: always }'].join('\n');},
flow:function(){return [
'# .gitlab/duo/flows/verdict-gate.yaml  (DRAFT: confirm the schema on docs.gitlab.com)',
'name: Verdict Gate',
'description: Reads the VERDICT line from the verify job, posts one discussion, labels the MR, proposes a fix, asks a human.',
'triggers:',
'  - event: pipeline            # Passed, Failed',
'steps:',
'  - id: read',
'    type: tool                  # deterministic, no model',
'    tool: get_job_logs',
'    inputs: { job_name: "verdict-gate:verify" }',
'  - id: extract',
'    type: tool',
'    tool: extract_lines_from_text',
'    inputs: { pattern: "^VERDICT " }',
'    stop_if_empty: true         # not our pipeline: stop, spend no credits',
'  - id: discuss',
'    type: agent',
'    prompt: |',
'      You are the Verdict Gate reporter. Copy the evidence table from the VERDICT JSON verbatim.',
'      Add at most three sentences marked "AI hypothesis". Never change outcome or numbers.',
'      Reuse the existing Verdict Gate discussion if one exists; never open a second one.',
'    tools: [list_all_merge_request_notes, create_merge_request_note, reply_to_discussion, update_merge_request]',
'  - id: fix',
'    type: agent',
'    when: outcome == "FAIL"',
'    prompt: |',
'      Using evidence[] (file, line, old, new), propose the smallest commit that removes every break.',
'      Protected files must not change: tests/**, flaky-quarantine.toml, locales/source.json.',
'    tools: [get_repository_file, list_merge_request_diffs, create_commit]',
'    max_rounds: 3               # the pipeline re-runs after each commit; stop and hand over after 3',
'  - id: approve',
'    type: human_input',
'    when: outcome == "PASS" && policy.hands_off == false',
'    prompt: "Verdict is PASS. Approve the merge?"',
'  - id: merge',
'    type: tool',
'    when: outcome == "PASS" && (approved || policy.hands_off)',
'    tool: update_merge_request',
'    inputs: { merge_when_pipeline_succeeds: true }'].join('\n');},
policy:function(){return [
'# verdict-gate.toml  (policy, versioned with the repo: the "configure" and "govern" stages)',
'[gate]',
'hands_off = false          # true: merge automatically on PASS with a green pipeline',
'max_rounds = 3             # fix attempts before the flow hands over to a human',
'protected = ["tests/**", "flaky-quarantine.toml", "locales/source.json"]',
'',
'[flaky]',
'alpha = 0.05',
'looks = 3                  # 100, 200, 300 runs per side; alpha / looks (Bonferroni)',
'target = 0.05              # residual failure rate accepted, at 95% confidence',
'weakened_test = "block"    # FIXED with a guard becomes FIXED BUT TEST WEAKENED',
'',
'[upgrade]',
'fail_on = "breaks"         # REVIEW and UNVERIFIED warn, never block',
'',
'[i18n]',
'max_ratio = 1.6',
'glossary = ["OK"]',
'languages = ["it", "en", "de", "fr", "es"]'].join('\n');},
schema:function(){return JSON.stringify({
 "$schema":"https://json-schema.org/draft/2020-12/schema","$id":"verdict-gate/1","title":"Verdict Gate verdict",
 "type":"object","required":["schema","verifier","outcome","detail","evidence","guards","needs_human"],
 "properties":{
  "schema":{"const":"verdict-gate/1"},
  "verifier":{"type":"string","enum":["upgrade","flaky","i18n"]},
  "target":{"type":["string","null"],"description":"what was judged: package and versions, test id, catalog"},
  "outcome":{"type":"string","enum":["PASS","FAIL","UNSURE","BROKEN"]},
  "detail":{"type":"string","description":"the verifier's own verdict name, kept verbatim"},
  "evidence":{"type":"array","items":{"type":"object"},"description":"facts a human can re-check: file:line, counts, p, bounds"},
  "guards":{"type":"array","items":{"type":"string"},"description":"anti-cheat findings; a PASS with guards needs a human"},
  "needs_human":{"type":"boolean"},
  "fix_hint":{"type":"string"},
  "limits":{"type":"string","description":"what this verifier cannot see, printed in every report"}
 },"additionalProperties":false},null,2);}
};
var FILENAMES={verify:'verify.yml',monitor:'monitor.yml',flow:'verdict-gate.yaml',policy:'verdict-gate.toml',schema:'verdict-v1.json'};
function renderFiles(){ var k=document.getElementById('g-file').value; document.getElementById('g-file-body').textContent=FILES[k](); }
document.getElementById('g-file').onchange=renderFiles;
document.getElementById('g-copy-file').onclick=function(){ copyText(document.getElementById('g-file-body').textContent); };
document.getElementById('g-dl-file').onclick=function(){ var k=document.getElementById('g-file').value; download(FILENAMES[k],FILES[k]()); };
document.getElementById('g-copy-verdict').onclick=function(){ if(lastVerdict) copyText(VG.verdictLine(lastVerdict)); };
document.getElementById('g-copy-md').onclick=function(){ if(lastVerdict) copyText(mrComment(lastVerdict)); };
document.getElementById('g-dl-json').onclick=function(){ if(lastVerdict) download('verdict.json',VG.verdictLine(lastVerdict).slice(8),'application/json'); };

applyLang();
runFlaky();
runI18n();
(function(){ document.getElementById('u-oldpkg').value=JSON.stringify(CHALK_OLD,null,2); document.getElementById('u-newpkg').value=JSON.stringify(CHALK_NEW,null,2); document.getElementById('u-new').value='6.0.1'; runUpgradeManual(); })();

</script>
